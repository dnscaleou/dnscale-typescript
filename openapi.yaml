    APIKeyZoneScope:
      type: object
      additionalProperties: false
      required: [zone_id, record_access, record_names]
      properties:
        zone_id:
          type: string
          format: uuid
        record_access:
          type: string
          enum: [all, names]
          description: Whole-zone or exact-name access.
        record_names:
          type: array
          maxItems: 100
          uniqueItems: true
          description: |
            Canonical relative owners. Use `@` for the apex. Names may
            also be supplied as in-zone absolute names when creating a key and
            are returned in canonical relative form. A literal `*` matches only
            the wildcard owner; it is not a glob. Required and non-empty when
            `record_access` is `names`; empty when it is `all`.
          items:
            type: string
          example: [_acme-challenge, _acme-challenge.api]

    APIKey:
      type: object
      additionalProperties: false
      required: [id, customer_id, user_id, name, scopes, created_at, updated_at, zone_ids, zone_scopes]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          writeOnly: true
          description: Secret API key. Present only in the create response.
        scopes:
          type: string
          description: JSON-encoded scope-name array.
          example: '["zones:read","records:read"]'
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        zone_ids:
          type: array
          description: Compatibility zone list. Empty means customer-wide.
          items:
            type: string
            format: uuid
        zone_scopes:
          type: array
          description: Per-zone resource policy. Empty means customer-wide.
          items:
            $ref: '#/components/schemas/APIKeyZoneScope'
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: string
          description: JSON-encoded array of scope names.
          example: '["zones:read","zones:write","records:read","records:write"]'
        expires_at:
          type: string
          format: date-time
          nullable: true
        zone_ids:
          type: array
          deprecated: true
          description: |
            Compatibility zone list.
            Grants all DNS names in every listed zone.
            Mutually exclusive with a non-empty `zone_scopes` value. Empty or
            omitted together with `zone_scopes` creates a customer-wide key.
          items:
            type: string
            format: uuid
        zone_scopes:
          type: array
          description: |
            Preferred per-zone resource policy.
            Each zone can grant all DNS names or up to 100 exact owner names;
            a key can contain at most 500 names total.
            Mutually exclusive with a non-empty `zone_ids` value.
          items:
            $ref: '#/components/schemas/APIKeyZoneScope'
    APIKeyData:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          $ref: '#/components/schemas/APIKey'
    APIKeyResponse:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
